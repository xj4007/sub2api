services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: sub2api-etcd
    restart: unless-stopped
    environment:
      ETCDCTL_API: "3"
    command: >
      /usr/local/bin/etcd
      --name ${ETCD_NAME}
      --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://${NODE_IP}:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://${NODE_IP}:2380
      --initial-cluster ${ETCD_INITIAL_CLUSTER}
      --initial-cluster-state new
      --initial-cluster-token sub2api-etcd
    volumes:
      - etcd_data:/etcd-data
    ports:
      - "2379:2379"
      - "2380:2380"

  patroni:
    image: db-patroni:latest
    container_name: sub2api-patroni
    restart: unless-stopped
    environment:
      NODE_IP: ${NODE_IP}
      ETCD_HOSTS: ${ETCD_HOSTS}
      PATRONI_SCOPE: ${PATRONI_SCOPE}
      PATRONI_NAME: ${PATRONI_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS}
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${POSTGRES_EFFECTIVE_CACHE_SIZE}
      POSTGRES_MAINTENANCE_WORK_MEM: ${POSTGRES_MAINTENANCE_WORK_MEM}
    depends_on:
      - etcd
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
      - "8008:8008"

  redis:
    image: redis:8-alpine
    container_name: sub2api-redis
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_IP: ${NODE_IP}
      REDIS_ROLE: ${REDIS_ROLE}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MASTER_HOST: ${REDIS_MASTER_HOST}
      REDIS_MAXCLIENTS: ${REDIS_MAXCLIENTS}
    volumes:
      - redis_data:/data
      - ./redis-start.sh:/redis-start.sh:ro
    command: ["sh", "/redis-start.sh"]

  sentinel:
    image: redis:8-alpine
    container_name: sub2api-redis-sentinel
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_IP: ${NODE_IP}
      REDIS_SENTINEL_MASTER_NAME: ${REDIS_SENTINEL_MASTER_NAME}
      REDIS_MASTER_HOST: ${REDIS_MASTER_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - redis
    volumes:
      - sentinel_data:/data
      - ./sentinel-start.sh:/sentinel-start.sh:ro
    command: ["sh", "/sentinel-start.sh"]

volumes:
  etcd_data:
  postgres_data:
  redis_data:
  sentinel_data:
